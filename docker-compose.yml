version: "3"

services:
  slims:
    container_name: slims
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ENV=${APP_ENV}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      # Login lewat Super App (opsional, lihat docs/SSO_SUPERAPP.md)
      - SUPERAPP_SSO_URL=${SUPERAPP_SSO_URL:-}
      - SUPERAPP_SSO_KUNCI=${SUPERAPP_SSO_KUNCI:-}
      - SUPERAPP_SSO_URL_TOMBOL=${SUPERAPP_SSO_URL_TOMBOL:-}
    volumes:
      - appfiles:/var/www/html/files
      - appimages:/var/www/html/images
      - apprepo:/var/www/html/repository
    ports:
      - "${HTTP_PORT}:80"
    networks:
      - proxy
    healthcheck:
      # sama dengan HEALTHCHECK di Dockerfile: Apache + PHP + koneksi database
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/health.php || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:lts
    container_name: db
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - ./install/senayan.sql:/docker-entrypoint-initdb.d/01-senayan.sql
      - ./install/sampledata.sql:/docker-entrypoint-initdb.d/02-sampledata.sql
      - dbdata:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASS}
      - MARIADB_DATABASE=${DB_NAME}
    healthcheck:
      # server MariaDB hidup dan menerima koneksi (berhasil walau tanpa login)
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - proxy

networks:
  proxy:
    driver: bridge

volumes:
  dbdata:
  appfiles:
  appimages:
  apprepo:
